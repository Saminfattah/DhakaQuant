[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-quant-worker"
version = "0.1.0"
description = "DhakaQuant local-only equity prediction and research-signal pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "kagglehub>=0.3,<1",
  "lightgbm>=4.5,<5",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<21",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.41,<2",
  "tenacity>=9,<10",
  "truststore>=0.10,<1",
  "lxml>=5,<7",
  "plotly>=5.24,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "responses>=0.25,<1",
  "ruff>=0.9,<1"
]

[project.scripts]
dse-quant = "dse_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
